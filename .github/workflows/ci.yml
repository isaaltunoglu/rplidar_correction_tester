name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the native SDK and adapter
        run: make -j2
      - name: Analysis and service checks
        run: make test
      - name: DOM integration
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run test:dom
      - name: Install optional browser tooling
        run: |
          python -m pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
      - name: Browser integration and screenshots
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
